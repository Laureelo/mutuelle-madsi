spring.application.name=madsi-backend

# ---------------------------------------------------------------------------
# Configuration locale : copier backend/.env.example en backend/.env et l'adapter.
# (Les variables d'environnement du système fonctionnent aussi.)
# ---------------------------------------------------------------------------
spring.config.import=optional:file:./.env[.properties]

# Serveur
server.port=${SERVER_PORT:8080}

# Base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mutuelle}
spring.datasource.username=${DB_USERNAME:postgres}
# Obligatoire : aucun mot de passe par défaut n'est fourni.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de connexions
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Sécurité
# Clé de signature des jetons (32 caractères minimum). Si absente, une clé aléatoire est
# générée au premier démarrage dans backend/data/jwt.secret.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}

# Origines autorisées à appeler l'API (adresses de l'application web), séparées par des virgules
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Messagerie (emails). Laisser MAIL_HOST vide = pas d'emails (les notifications restent dans l'application).
# Gmail : MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=adresse du compte, MAIL_PASSWORD=mot de passe d'application.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:}
# Adresse de l'application, utilisée dans les liens des emails (ex. https://mutuelle.dgsi.bf ou http://192.168.1.10:8080)
app.public-url=${PUBLIC_URL:http://localhost:8080}

# Dossier des sauvegardes de la base (créées par sauvegarder.bat / sauvegarder.sh, surveillées par « Santé du système »)
app.backup.dir=${BACKUP_DIR:./sauvegardes}

# Journaux
logging.level.root=INFO
